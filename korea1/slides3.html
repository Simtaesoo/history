# 여러 나라의 성장 | 부여 · 고구려 · 옥저 · 동예 · 삼한 | 역사② Ⅰ. 국가의 형성과 발전 · 3차시 | 2022 개정 교육과정 [9역08-01]

= 오늘의 학습 목표 | 3차시
^ 『삼국지』 위서 동이전의 기록을 읽고 해석할 수 있다.
^ 여러 나라의 **정치·풍습**을 비교할 수 있다.
^ 자연환경과 위치가 나라의 성장에 준 영향을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 북쪽 나라(부여·고구려) 10분 → 동해안(옥저·동예) 8분 → 삼한 8분 → 게임 10분 → 정리

= 중국 사람이 쓴 우리 역사 | 생각 열기
" 동이(東夷)의 여러 나라에 대해 들은 대로 차례로 적는다. | 『삼국지』 위서 동이전을 쓴 진수의 뜻 (요약)
? 중국 사람이 쓴 우리 역사 기록을 읽을 때 무엇을 조심해야 할까? :: 직접 본 것이 아니라 들은 것일 수 있고, 중국 중심의 시각이 들어 있다.
% 동이전은 3세기 무렵 중국 진(晉)의 진수가 쓴 『삼국지』의 일부

= 다섯 나라는 어디에 있었을까 | 지도
| 나라 | 위치 | 한마디 |
|+ 부여 | 쑹화강 유역 넓은 평야 | 농경과 목축 |
|+ 고구려 | 압록강 유역 산간 | 정복으로 성장 |
|+ 옥저 | 함경도 동해안 | 해산물·소금 |
|+ 동예 | 강원도 북부 동해안 | 특산물이 유명 |

## 북쪽의 나라 | 부여와 고구려

= 부여 | 쑹화강의 평야
+ 왕 아래 **마가·우가·저가·구가**가 각자 ==사출도==를 다스렸다
+ 도둑질하면 12배로 갚게 했다 (==1책 12법==)
+ 12월에 제천 행사 ==영고==
+ 왕이 죽으면 사람을 함께 묻는 **순장**
? 관리 이름에 말·소·돼지·개가 들어간 것은 무엇을 뜻할까? :: 목축이 중요했다.

= 고구려 | 압록강의 산골
+ 산이 많아 농사지을 땅이 부족 → 주변을 **정복**하며 성장
+ 5부가 힘을 모았고, 큰일은 ==제가 회의==에서 정했다
+ 10월 제천 행사 ==동맹==
+ 결혼한 뒤 신랑이 신부 집 뒤편 작은 집에서 사는 **서옥제**
? 부여와 고구려는 어떤 점이 비슷할까? :: 왕과 함께 여러 가(加)가 힘을 나눠 가졌고, 제천 행사를 열었다.

## 동해안의 나라 | 옥저와 동예

= 옥저와 동예
| | 옥저 | 동예 |
|+ 지배자 | 읍군·삼로 | 읍군·삼로 |
|+ 경제 | 해산물·소금 | 단궁·과하마·반어피 |
|+ 풍습 | ==민며느리제==, 가족 공동 무덤 | ==책화==, 족외혼 |
|+ 제천 행사 | — | 10월 ==무천== |
>+ 왕이 없는 작은 나라 → 결국 ==고구려==에 흡수되었다
? 동예는 다른 마을의 경계를 침범하면 노비나 소·말로 물어주게 했다. 왜 필요했을까? :: 마을마다 산과 내를 경계로 생활 터전을 지켰기 때문이다.

## 남쪽의 나라 | 삼한

= 삼한 | 영상으로 보기
V 삼한으로 통한 고대 아이언 로드 | KBS 영상한국사 | https://www.youtube.com/watch?v=bMoFpA8rcLU | 변한의 철이 간 길

= 삼한 | 마한 · 진한 · 변한
+ 여러 작은 나라의 연맹 — **마한의 목지국** 지배자가 이끌었다
+ 정치는 신지·읍차, 제사는 ==천군==이 맡았다
+ 천군이 다스리는 **소도**에는 군장의 힘이 미치지 못했다 → 제사와 정치의 분리
+ 5월·10월 **계절제** — 벼농사가 발달
+ ==변한==의 철 → 낙랑·왜에 수출, 철 덩어리를 돈처럼 썼다

= 제천 행사 한눈에 | 비교
*+ 🌾 부여 · 영고 :: 12월
*+ 🏔️ 고구려 · 동맹 :: 10월
*+ 🌊 동예 · 무천 :: 10월
*+ 🌱 삼한 · 계절제 :: 5월 · 10월
? 제천 행사가 대부분 가을·겨울에 열린 까닭은? :: 한 해 농사를 마치고 하늘에 감사하는 추수 감사제였다. 삼한은 씨 뿌린 뒤 5월에도 열었다.

= 확인 문제 1
Q 다음 풍습이 있었던 나라는? — "다른 마을의 경계를 침범하면 노비나 소·말로 갚았다."
o 부여
o 옥저
o* 동예
o 삼한
:: 동예의 책화이다.

= 확인 문제 2
Q 삼한에 대한 설명으로 옳은 것은?
o 사출도가 있었다.
o 민며느리제가 있었다.
o* 천군이 다스리는 소도가 있었다.
o 12월에 영고를 열었다.
:: 사출도·영고는 부여, 민며느리제는 옥저.

= 생각 질문 | 서술형
? 옥저와 동예는 왜 왕이 다스리는 나라로 성장하지 못했을까? :: 동해안 좁은 땅에 치우쳐 있고 고구려의 압박을 받아 큰 세력으로 뭉치기 어려웠다.
? 삼한의 소도와 단군왕검 시대를 비교하면 제사와 정치의 관계는 어떻게 바뀌었을까? :: 제정일치에서 제사(천군)와 정치(군장)가 나뉘는 제정 분리로 바뀌었다.
? 동이전에서 그대로 믿기 어려운 부분은 어디일까? :: 중국 사람이 전해 들은 이야기라 과장·오해가 있을 수 있다. 다른 기록·유물과 비교해야 한다.

= 오늘 배운 내용 정리
- 부여는 왕 아래 여러 가가 [[사출도]]를 다스렸고 12월에 [[영고]]를 열었다.
- 고구려는 큰일을 [[제가 회의]]에서 정했고 10월에 동맹을 열었다.
- 옥저는 [[민며느리제]], 동예는 [[책화]]와 무천이 있었다.
- 삼한은 제사장 [[천군]]이 소도를 다스렸고, 변한은 [[철]]이 유명했다.

= 나가기 전 한 문제 | 형성평가
? 부여·옥저·삼한 중 하나를 골라, 그 나라의 풍습과 그 풍습이 보여 주는 사회 모습을 한 문장으로 쓰시오. :: (예) 삼한은 소도를 두어 제사와 정치가 나뉘어 있었다.
