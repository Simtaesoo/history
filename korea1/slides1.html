## 청동기 시대 | 남는 곡식과 지배자의 등장

= 청동기 시대, 무엇이 달라졌나
! 기원전 2000년경 ~ 1500년경, 만주와 한반도에 청동기 문화
+ **벼농사**가 시작되고 농사가 늘었다 — 곡식은 여전히 ==반달 돌칼==로 거두었다
+ 남는 곡식이 생기자 **사유 재산**과 빈부 차이가 생겼다
+ 땅과 물을 두고 마을끼리 다툼 → 힘센 사람이 **군장(지배자)**이 되었다
>+ 재산 → 계급 → 지배자 → 여러 마을을 아우르는 **나라**

= 청동기 시대의 유물 | 무엇을 말해 줄까
*+ 🗡️ 비파형 동검 :: 악기 비파를 닮은 칼. 지배자의 무기이자 권위의 상징
*+ 🪞 거친무늬 거울 :: 햇빛을 반사하는 제사 도구. 지배자는 제사장이기도 했다
*+ 🌾 반달 돌칼 :: 이삭을 자르는 돌 농기구. 농사는 여전히 돌로!
*+ 🏺 민무늬 토기 :: 무늬 없는 토기. 곡식을 저장했다

= 고인돌 | 지배자의 무덤
! 덮개돌이 수십 톤 — 누가, 어떻게 옮겼을까?
+ 고인돌 하나를 세우려면 **수백 명**이 힘을 모아야 했다
+ 그만큼 많은 사람을 **움직일 수 있는 지배자**가 있었다는 증거
+ 고창·화순·강화 고인돌 유적은 2000년 ==유네스코 세계유산==으로 등재
? 고인돌 아래에서 비파형 동검이 함께 나왔다면 무엇을 알 수 있을까? :: 무덤의 주인이 청동 무기를 가진 지배자였다.
% 한반도에는 세계 고인돌의 상당수가 있다는 점을 덧붙여도 좋다(정확한 비율은 자료마다 달라 숫자는 말하지 않기)

= 석기와 청동기 | 비교해 보기
| | 간석기(돌) | 청동기 |
|+ 재료 구하기 | 어디서나 | 구리·주석을 구하기 어렵다 |
|+ 만드는 법 | 갈아서 만든다 | 녹여서 거푸집에 붓는다 |
|+ 쓴 사람 | 마을 사람 누구나 | 소수의 지배자 |
|+ 쓰임 | 농기구·생활 도구 | 무기·제사 도구 |
>+ 청동기는 '모두의 도구'가 아니라 '지배자의 물건'이었다.

## 고조선의 성립 | 우리 역사의 첫 나라

= 고조선의 건국 | 단군왕검
! 기록에 따르면 기원전 2333년, ==단군왕검==이 고조선을 세웠다
- 고조선의 건국 이야기는 고려 때 일연이 쓴 『**삼국유사**』에 전한다.
- 원래 이름은 '조선' — 이성계의 조선과 구분하려고 '고(古)조선'이라 부른다.
~ 건국 연도는 기록에 따른 것이고, 고고학 자료로는 청동기 문화를 바탕으로 성장한 나라로 본다.

= 건국 이야기 읽기 | 사료
" 환웅이 무리 3천 명을 거느리고 태백산 꼭대기 신단수 아래로 내려왔다. 풍백·우사·운사를 거느리고 곡식·생명·질병·형벌·선악 등 인간의 360여 가지 일을 맡아 다스렸다. | 『삼국유사』 고조선 (쉬운 말로 옮김)
"+ 곰은 삼칠일 동안 쑥과 마늘을 먹으며 금기를 지켜 여자가 되었고, 호랑이는 참지 못해 사람이 되지 못했다. 환웅이 웅녀와 혼인하여 단군왕검을 낳았다. | 『삼국유사』 고조선 (쉬운 말로 옮김)
% 읽기 전에 "이야기에서 '사실이 아닐 것 같은 것'과 '당시 사회를 보여 주는 것'을 나눠 보자"고 과제 주기

= 이야기 속에 숨은 사회 | 해석하기
| 이야기 | 알 수 있는 사회 모습 |
|+ 환웅이 하늘에서 내려왔다 | 하늘의 자손이라 내세운 집단 = 다른 곳에서 온 세력 |
|+ 바람·비·구름을 다스리는 신하 | ==농사==를 중시한 사회 |
|+ 곰과 호랑이 | 곰을 믿는 부족과 손잡고, 호랑이 부족은 밀려남 |
|+ 단군(제사장) + 왕검(지배자) | 제사와 정치를 한 사람이 맡은 ==제정일치== |
? 곰과 호랑이는 실제 동물일까? :: 각 동물을 섬기던 부족을 나타낸다고 보는 해석이 많다.

= 고조선은 어디까지였을까 | 영상으로 보기
V 북한에 있는 고조선의 고인돌들 | KBS 영상한국사 | https://www.youtube.com/watch?v=mwBzBdnAshE | 지도와 함께 본다

= 고조선은 어디까지였을까 | 유물로 추정하기
- 고조선의 땅을 알려 주는 유물 세 가지
+ **비파형 동검**
+ **탁자식 고인돌**
+ **미송리식 토기**
>+ 세 유물이 함께 나오는 곳 → 만주 랴오닝 지방에서 한반도 서북부
% 유물이 나왔다고 곧바로 '영토'는 아니라는 점 — 생각 질문 3과 연결

= 확인 문제 1
Q 청동기 시대의 모습으로 옳지 **않은** 것은?
o 벼농사가 시작되었다.
o 빈부 차이와 계급이 생겼다.
o* 모든 농기구를 청동으로 만들었다.
o 군장이 나타났다.
:: 청동은 귀해서 무기·제사 도구로 썼고, 농기구는 반달 돌칼 같은 간석기를 썼다.

= 확인 문제 2
Q 고조선 건국 이야기에서 '풍백·우사·운사'가 보여 주는 것은?
o 바다를 건너 무역했다.
o* 농사를 중요하게 여겼다.
o 불교를 믿었다.
o 법으로 나라를 다스렸다.
:: 바람·비·구름은 농사에 꼭 필요한 날씨다.

= 확인 문제 3
Q 고조선의 세력 범위를 짐작하게 하는 유물이 **아닌** 것은?
o 비파형 동검
o 탁자식 고인돌
o 미송리식 토기
o* 주먹도끼
:: 주먹도끼는 구석기 시대의 뗀석기이다.

= 생각 질문 | 서술형
? 모두 함께 일하던 마을에서 지배자가 나타난 까닭은? 농사와 남는 곡식에 연결해 보자. :: 농사로 남는 곡식이 생기자 재산의 차이가 생겼고, 재산과 힘을 가진 사람이 다른 사람을 다스리게 되었다.
? 건국 이야기는 사실일까, 꾸민 이야기일까? 이야기 속 '역사적 사실'을 골라내려면 어떤 증거가 더 필요할까? :: 신화는 그대로 사실은 아니지만 당시 사회를 반영한다. 유물·유적 같은 고고학 증거와 비교해야 한다.
? 유물이 나온 곳을 곧바로 그 나라의 땅으로 볼 수 있을까? :: 교역이나 이동으로 유물이 옮겨질 수 있어, 여러 유물이 함께 나오는지와 다른 기록을 함께 봐야 한다.

= 오늘 배운 내용 정리
- 청동기 시대에 [[벼농사]]가 시작되고 남는 곡식이 생겼다.
- 재산의 차이로 계급이 생기고 [[군장]]이 나타났다.
- 비파형 동검과 거친무늬 거울은 [[지배자]]의 무기·제사 도구였다.
- 고조선은 [[단군왕검]]이 세웠고, 제사와 정치를 함께 맡는 [[제정일치]] 사회였다.
- 비파형 동검·탁자식 고인돌·[[미송리식 토기]]로 세력 범위를 짐작한다.

= 나가기 전 한 문제 | 형성평가
? 고인돌과 비파형 동검을 근거로, 청동기 시대에 지배자가 나타났다는 것을 한 문장으로 쓰시오. :: 수십 톤의 덮개돌을 옮길 사람을 부리고 귀한 청동 무기를 가진 지배자가 있었다.
