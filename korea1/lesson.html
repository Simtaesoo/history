<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차시 · 역사② Ⅰ단원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="gnb"></div>
<div class="page"><div class="shell"><aside class="side" id="side"></aside><main id="main"></main></div></div>
<div class="pres" id="pres" hidden role="dialog" aria-modal="true" aria-label="수업 모드"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { esc, I, BADGE, ytId, store, sfx } = K1, $ = id => document.getElementById(id);
  const n = Math.min(Math.max(+K1.qs("n") || 1, 1), LESSONS.length), L = LESSONS[n - 1], prev = LESSONS[n - 2], next = LESSONS[n];
  document.title = `${n}차시 ${L.title} · 역사② Ⅰ단원`;
  const gameHref = L.game.sim ? "sim.html" : `game.html?g=${L.game.id}`;
  $("gnb").innerHTML = K1.gnb([["역사② Ⅰ단원", "index.html"], [`${n}차시`, ""]], `<a class="btn sm ghost" href="${gameHref}">${I.game}<span class="hide-m">게임</span></a><button class="btn sm pri" type="button" data-pres>${I.screen}수업 모드</button>`);
  $("side").innerHTML = `<h4>${UNIT.book} ${UNIT.no}. ${esc(UNIT.title)}</h4><ol>${LESSONS.map(l => `<li><a href="lesson.html?n=${l.n}"${l.n === n ? ' aria-current="page"' : ""}><span class="k">${l.n}</span><span>${esc(l.title.split(" — ")[0])}</span></a></li>`).join("")}</ol><p class="back"><a href="index.html">단원 전체 보기</a></p>`;

  const key = "pr:" + n, checked = store.get(key, []), done = store.get("done", {});
  const stCls = { 도입: "s0", 전개: "s1", 정리: "s2" };
  const vid = v => {
    const id = ytId(v.url), b = BADGE[v.badge];
    const th = id ? `style="background-image:url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)"` : "";
    return `<a class="vid" href="${esc(v.url)}" target="_blank" rel="noopener"><div class="thumb" ${th}>${id ? "" : `<span class="src-logo">${esc(v.src)}</span>`}<span class="play">${I.play}</span></div>
      <div class="body"><span class="ttl">${esc(v.t)}</span><span class="who"><span>${esc(v.src)}</span><span class="chip ${b[1]}" title="${esc(b[2])}">${b[0]}</span></span><span class="use">${esc(v.use)}</span></div></a>`;
  };
  const prompts = () => `<ul class="qs">${L.prompts.map(([s, t], i) => `<li><label class="q${checked[i] ? " done" : ""}"><input type="checkbox" data-pi="${i}"${checked[i] ? " checked" : ""} aria-label="${s} 발문 했어요"><span class="st ${stCls[s]}">${s}</span><span class="tx">${esc(t)}</span></label></li>`).join("")}</ul>`;
  const nDone = () => L.prompts.filter((_, i) => checked[i]).length;
  const progress = () => `<span class="prog"><span class="num">${nDone()} / ${L.prompts.length}</span><span class="bar"><i style="width:${nDone() / L.prompts.length * 100}%"></i></span></span>`;

  function render() {
    $("main").innerHTML = `
    <div class="mnav no-print"><select aria-label="차시 고르기" onchange="location.href='lesson.html?n='+this.value">${LESSONS.map(l => `<option value="${l.n}"${l.n === n ? " selected" : ""}>${l.n}차시 · ${esc(l.title.split(" — ")[0])}</option>`).join("")}</select></div>
    <article class="card">
      <header class="lhead">
        <div class="bignum">${n}<small>차시</small></div>
        <div>
          <div class="row"><span class="chip brand">${L.std === "전체" ? "단원 정리" : esc(L.std)}</span><span class="chip">${esc(L.eraLabel)}</span>${done[n] ? '<span class="chip ok">수업함</span>' : ""}</div>
          <h1>${esc(L.title)}</h1>
          ${K1.eraRibbon(L)}
          <div class="actions no-print">
            <button class="btn pri" type="button" data-pres>${I.screen}수업 모드로 띄우기</button>
            <a class="btn" href="${gameHref}">${I.game}${esc(L.game.name)}</a>
            <button class="btn" type="button" onclick="print()">${I.print}활동지 인쇄</button>
          </div>
        </div>
      </header>
      <div class="sec" style="padding-top:0;border-top:0">
        <div class="goal"><b>학습 목표</b><span>${esc(L.goal)}</span></div>
        <nav class="flow no-print" aria-label="수업 흐름">${[["video", "영상으로 열기"], ["prompts", "교사 발문"], ["think", "생각 질문"], ["game", "게임"]].map(([id, t], i) => `<a href="#${id}"><i>${i + 1}</i><b>${t}</b></a>`).join("")}</nav>
      </div>
      <section class="sec" id="video">
        <div class="sec-h"><h2>영상으로 열기</h2><span class="meta">${L.videos.length}편 · 5분 안쪽으로 끊어 쓰기</span></div>
        <div class="vids">${L.videos.map(vid).join("")}</div>
        ${L.note ? `<p class="note-box">${esc(L.note)} ${L.source ? `<a href="${esc(L.source.url)}" target="_blank" rel="noopener">${esc(L.source.t)}</a>` : ""}</p>` : ""}
      </section>
      <section class="sec" id="prompts">
        <div class="sec-h"><h2>교사 발문</h2><span id="prog">${progress()}</span></div>
        <div id="plist">${prompts()}</div>
        <div style="display:flex;gap:8px;margin-top:12px" class="no-print"><button class="btn sm ghost" type="button" id="reset">${I.reset}체크 지우기</button><span class="muted" style="font-size:13px;align-self:center">수업하며 한 발문을 체크하세요. 이 기기에 남아 다음 반 수업 때 이어 쓸 수 있어요.</span></div>
      </section>
      <section class="sec" id="think">
        <div class="sec-h"><h2>생각 질문</h2><span class="meta">활동지·출구 카드용</span></div>
        <div class="think">${L.think.map((t, i) => `<div class="tq"><span class="n">${i + 1}</span><p>${esc(t)}</p></div>`).join("")}</div>
      </section>
      <section class="sec" id="game">
        <div class="sec-h"><h2>${L.game.sim ? "시뮬레이션" : "수업 게임"}</h2><span class="meta">${esc(L.game.time)}</span></div>
        <div class="gamecard"><div><span class="chip brand">${L.game.sim ? "시뮬레이션" : "게임"}</span><h3>${esc(L.game.name)}</h3><p>${esc(L.game.how)}</p></div><a class="btn pri lg" href="${gameHref}">${L.game.sim ? I.map : I.game}시작하기</a></div>
        ${L.caution ? `<p class="note-box warn">${esc(L.caution)}</p>` : ""}
      </section>
      ${L.assess ? `<section class="sec"><div class="sec-h"><h2>서술형 평가 예시</h2></div><table class="tbl"><thead><tr><th style="width:110px">성취기준</th><th>문항</th></tr></thead><tbody>${L.assess.map(([c, t]) => `<tr><td><span class="chip brand">${c}</span></td><td>${esc(t)}</td></tr>`).join("")}</tbody></table></section>` : ""}
      <div class="sec no-print" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <span class="muted" style="font-size:14px">${done[n] ? "이 차시를 수업함으로 표시했어요." : "수업을 마치면 표시해 두세요. 단원 목록에 보여요."}</span>
        <button class="btn" type="button" id="doneBtn">${done[n] ? "표시 지우기" : "수업함으로 표시"}</button>
      </div>
    </article>
    <section class="print-only">
      <h2 style="margin:0 0 4px">${n}차시 생각 질문 — ${esc(L.title)}</h2>
      <p style="margin:0 0 18px">${UNIT.book} ${UNIT.no}. ${esc(UNIT.title)} · ___학년 ___반 ___번 이름 __________</p>
      ${L.think.map((t, i) => `<div style="margin-bottom:22px;break-inside:avoid"><p style="font-weight:700;margin:0 0 8px">${i + 1}. ${esc(t)}</p>${"<div style='border-bottom:1px solid #999;height:30px'></div>".repeat(4)}</div>`).join("")}
    </section>
    <nav class="pager no-print">${prev ? `<a href="lesson.html?n=${prev.n}"><small>이전 차시</small><b>${prev.n}. ${esc(prev.title.split(" — ")[0])}</b></a>` : "<span></span>"}${next ? `<a class="nx" href="lesson.html?n=${next.n}"><small>다음 차시</small><b>${next.n}. ${esc(next.title.split(" — ")[0])}</b></a>` : `<a class="nx" href="index.html"><small>단원</small><b>단원 전체 보기</b></a>`}</nav>`;
    bind();
  }
  function bind() {
    document.querySelectorAll("[data-pi]").forEach(c => c.onchange = () => { checked[+c.dataset.pi] = c.checked; store.set(key, checked); c.closest(".q").classList.toggle("done", c.checked); $("prog").innerHTML = progress() });
    $("reset").onclick = () => { checked.length = 0; store.set(key, []); $("plist").innerHTML = prompts(); $("prog").innerHTML = progress(); bind() };
    $("doneBtn").onclick = () => { if (done[n]) delete done[n]; else done[n] = Date.now(); store.set("done", done); render() };
    document.querySelectorAll("[data-pres]").forEach(b => b.onclick = openPres);
  }

  // ── 수업 모드: 목표 → 발문 하나씩 → 생각 질문 → 게임. ←/→ 넘기기, Esc 닫기, 타이머 ──
  const slides = [{ lab: `${n}차시 학습 목표`, big: L.goal, sub: L.title }]
    .concat(L.videos.length ? [{ lab: "영상으로 열기", big: L.videos[0].t, sub: `${L.videos[0].src} — ${L.videos[0].use}`, url: L.videos[0].url }] : [])
    .concat(L.prompts.map(([s, t], i) => { const m = /\s*\(([^()]*)\)\s*$/.exec(t); return { lab: `${s} 발문 ${i + 1}/${L.prompts.length}`, big: m ? t.slice(0, m.index) : t, ans: m ? m[1] : "", pi: i } }))
    .concat(L.think.map((t, i) => ({ lab: `생각 질문 ${i + 1}`, big: t, sub: "짝과 1분 이야기한 뒤 한 문장으로 적어 보세요." })))
    .concat([{ lab: L.game.sim ? "시뮬레이션" : "수업 게임", big: L.game.name, sub: L.game.how, game: 1 }]);
  let si = 0, tLeft = 0, tRun = null;
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  function drawPres() {
    const s = slides[si], P = $("pres");
    P.innerHTML = `<div class="pres-top"><span class="t">${n}차시 · ${esc(L.title)}</span><span class="sp"></span>
      <div class="timer" aria-label="타이머">${[1, 3, 5].map(m => `<button class="btn sm ghost" type="button" data-t="${m}">${m}분</button>`).join("")}<b class="num ${tRun === null && tLeft === 0 ? "" : tLeft === 0 ? "end" : ""}" id="tv">${fmt(tLeft)}</b><button class="btn sm" type="button" id="tgo">${tRun ? "멈춤" : "시작"}</button></div>
      <button class="btn sm ghost" type="button" id="pfs" title="전체 화면">${I.full}</button><button class="btn sm" type="button" id="px">닫기</button></div>
      <div class="pres-main"><div class="slide"><span class="lab">${esc(s.lab)}</span><p class="big">${esc(s.big)}</p>${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ""}${s.ans ? `<details class="ans"><summary>예시 답 보기</summary><p>${esc(s.ans)}</p></details>` : ""}
        ${s.url ? `<p style="margin-top:3vh"><a class="btn pri lg" href="${esc(s.url)}" target="_blank" rel="noopener">${I.play.replace("<svg", '<svg fill="currentColor"')}영상 열기</a></p>` : ""}
        ${s.game ? `<p style="margin-top:3vh"><a class="btn pri lg" href="${gameHref}">${I.game}시작하기</a></p>` : ""}
        ${s.pi !== undefined ? `<p style="margin-top:3vh"><label class="btn"><input type="checkbox" id="pchk" ${checked[s.pi] ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--brand)"> 이 발문 했어요</label></p>` : ""}</div></div>
      <div class="pres-bot"><button class="btn" type="button" id="pp" ${si === 0 ? "disabled" : ""}>${I.left}이전</button><div class="dots">${slides.map((_, i) => `<i class="${i === si ? "on" : ""}"></i>`).join("")}</div><span class="muted num" style="font-size:13px">${si + 1} / ${slides.length}</span><button class="btn pri" type="button" id="pn" ${si === slides.length - 1 ? "disabled" : ""}>다음${I.right}</button></div>`;
    $("px").onclick = closePres; $("pp").onclick = () => go(-1); $("pn").onclick = () => go(1);
    $("pfs").onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : P.requestFullscreen() } catch (e) { } };
    P.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { tLeft = +b.dataset.t * 60; startT() });
    $("tgo").onclick = () => tRun ? stopT() : (tLeft > 0 && startT());
    const pc = $("pchk"); if (pc) pc.onchange = () => { checked[s.pi] = pc.checked; store.set(key, checked) };
  }
  function startT() { stopT(); tRun = setInterval(() => { tLeft = Math.max(0, tLeft - 1); const tv = $("tv"); if (tv) { tv.textContent = fmt(tLeft); tv.classList.toggle("end", tLeft === 0) } if (tLeft <= 3 && tLeft > 0) sfx.tick(); if (tLeft === 0) { sfx.end(); stopT() } }, 1000); drawPres() }
  function stopT() { if (tRun) clearInterval(tRun); tRun = null; const g = $("tgo"); if (g) g.textContent = "시작" }
  const go = d => { si = Math.min(Math.max(si + d, 0), slides.length - 1); drawPres() };
  function openPres() { si = 0; $("pres").hidden = false; document.body.style.overflow = "hidden"; drawPres(); $("pn") && $("pn").focus() }
  function closePres() { stopT(); $("pres").hidden = true; document.body.style.overflow = ""; if (document.fullscreenElement) document.exitFullscreen(); render() }
  document.addEventListener("keydown", e => { if ($("pres").hidden) return; if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(1) } else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1) } else if (e.key === "Escape" && !document.fullscreenElement) closePres() });
  render();
  if (K1.qs("present") === "1") openPres();
})();
</script>
</body>
</html>
