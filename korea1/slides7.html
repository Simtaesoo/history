# 삼국과 가야의 문화 ① | 고분과 불교 | 역사② Ⅰ. 국가의 형성과 발전 · 7차시 | 2022 개정 교육과정 [9역08-03]

= 오늘의 학습 목표 | 7차시
^ 나라마다 다른 **무덤 구조**를 비교할 수 있다.
^ 무덤과 유물이 보여 주는 **믿음·교류·권력**을 분석할 수 있다.

% 흐름: 생각 열기 5분 → 고구려 8분 → 백제 7분 → 신라·가야 8분 → 불교 5분 → 게임 10분 → 정리

= 1,500년 뒤의 우리 | 영상으로 보기
V 고구려 고분 벽화 | 국립중앙박물관 | https://modu.museum.go.kr/explore/video/20569 | 생활 모습 → 사신도로 바뀐 흐름에 주목

= 1,500년 뒤의 우리 | 생각 열기
? 1,500년 뒤 사람들이 우리를 연구한다면 무엇을 보고 알아낼까? 고대 사람들에게는 그것이 왜 무덤일까? :: 글 기록이 적어서, 무덤 속 유물·그림이 그 시대를 보여 주는 가장 큰 자료이다.

## 고구려의 무덤 | 벽에 그린 세상

= 고구려 | 돌무지무덤에서 굴식 돌방무덤으로
| | 돌무지무덤 | 굴식 돌방무덤 |
|+ 만든 법 | 돌을 계단처럼 쌓음 | 돌로 방을 만들고 흙으로 덮음 |
|+ 대표 | 장군총 | 무용총, 강서대묘 |
|+ 특징 | 벽화 없음 | 방 벽에 ==벽화== |
>+ 굴식 돌방무덤은 입구가 있어 ==도굴==되기 쉬웠다 → 유물은 적고 벽화가 남았다

= 벽화가 바뀌었다 | 생활에서 수호신으로
*+ 🏹 앞 시기 :: 사냥, 씨름, 춤, 부엌 — 살아 있을 때의 생활
*+ 🐉 뒤 시기 :: 청룡·백호·주작·현무 — 무덤을 지키는 ==사신도==
? 벽화가 '생활'에서 '사신도'로 바뀐 것은 무엇이 바뀐 것일까? :: 죽은 뒤의 세계를 지켜 준다는 도교의 영향, 믿음의 변화

## 백제의 무덤 | 닮은 꼴 찾기

= 백제 | 영상으로 보기
V 백제금동대향로, 세계에는 누가 살고 있을까? | 국립부여박물관 | https://modu.museum.go.kr/explore/video/20064 | 유교·불교·도교가 한 유물에 모인 부분

= 백제 | 무덤이 말하는 교류
^+ 한성: 서울 석촌동 ==돌무지무덤== — 고구려와 닮음 → 같은 뿌리
^+ 웅진: 공주 송산리 고분군 굴식 돌방무덤
^+ 무령왕릉: ==벽돌무덤== — 중국 남조(양)의 양식, 양나라 동전도 나옴
? 무덤 모양이 바뀐 것은 무엇을 알려 줄까? :: 고구려에서 온 건국 세력, 이후 중국 남조와의 활발한 교류

## 신라와 가야 | 금관과 철

= 신라 | 영상으로 보기
V 황금을 지킨 신라 무덤의 트릭 | EBS 역사채널e | http://www.ebs.co.kr/tv/show?prodId=10000&lectId=10519424 | 도굴에 강한 구조

= 신라 | 돌무지덧널무덤
+ 나무 덧널 → 위에 돌을 쌓고 → 흙으로 크게 덮음
+ 입구가 없어 ==도굴이 어려움== → 금관·금허리띠 등이 그대로
+ 천마총, 황남대총 (경주)
? 신라 무덤에서는 금관이 나왔는데 고구려·백제 돌방무덤에서는 유물이 적은 까닭은? :: 입구가 있는 돌방무덤은 도굴되기 쉬웠고, 돌무지덧널무덤은 입구가 없어 도굴이 어려웠다.

= 가야 | 철과 토기
*+ ⚔️ 철 :: 철갑옷·철제 무기·덩이쇠가 많이 묻혔다
*+ 🏺 토기 :: 단단한 회청색 가야 토기 → 일본 스에키에 영향
*+ ⛰️ 고분군 :: 김해 대성동, 고령 지산동 — 언덕 위에 줄지어
? 가야 무덤에 철이 많이 묻힌 것은 무엇을 보여 줄까? :: 철 생산과 교역으로 얻은 부와 군사력

## 불교 | 왕의 힘이 된 종교

= 불교의 전래
| 나라 | 들어온 때 | 의미 |
|+ 고구려 | 372년 (소수림왕) | 중국 전진에서 |
|+ 백제 | 384년 (침류왕) | 중국 동진에서 |

>+ "왕이 곧 부처" — 불교는 백성을 하나로 묶고 ==왕의 권위==를 높였다

T 10 | 나라 이름 없는 발굴 보고서를 읽고, 어느 나라 무덤인지 근거와 함께 맞히기

= 확인 문제 1
Q 다음 설명에 해당하는 무덤은? — "입구가 없어 도굴이 어렵고, 금관이 그대로 남아 있었다."
o 고구려 굴식 돌방무덤
o 백제 벽돌무덤
o* 신라 돌무지덧널무덤
o 고구려 돌무지무덤
:: 경주 천마총·황남대총 같은 신라의 돌무지덧널무덤.

= 확인 문제 2
Q 무령왕릉이 중국 남조와의 교류를 보여 주는 까닭은?
o 사신도가 그려져 있어서
o* 남조 양식의 벽돌무덤이어서
o 금관이 나와서
o 돌을 계단처럼 쌓아서
:: 벽돌로 쌓은 무덤은 중국 남조의 양식이다.

= 생각 질문 | 서술형
? 왕과 귀족은 왜 보이지도 않을 무덤 안에 금관과 벽화를 넣었을까? :: 죽은 뒤에도 삶이 이어진다고 믿었고, 큰 무덤과 화려한 유물로 살아 있는 사람에게 권력을 보여 주었다.
? 불교가 들어오면서 왕의 힘이 강해졌다고 한다. 종교와 정치는 어떻게 연결될 수 있을까? :: 모든 백성이 같은 믿음을 가지면 하나로 뭉치기 쉽고, 왕을 부처와 연결해 권위를 높일 수 있다.
? 도굴된 무덤과 도굴되지 않은 무덤은 역사 연구에 각각 어떤 한계와 가능성을 주는가? :: 도굴된 무덤은 구조·벽화만 남아 생활을 알기 어렵고, 도굴되지 않은 무덤은 유물로 연대·교류까지 알 수 있다.

= 오늘 배운 내용 정리
- 고구려 굴식 돌방무덤에는 [[벽화]]가 남았고, 뒤 시기엔 [[사신도]]가 그려졌다.
- 백제 초기 무덤은 고구려와, [[무령왕릉]]은 중국 남조와 닮았다.
- 신라 [[돌무지덧널무덤]]은 도굴이 어려워 금관이 남았다.
- 불교는 고구려 [[372]]년, 백제 384년, 신라 527년(공인)에 받아들였다.

= 나가기 전 한 문제 | 형성평가
? 두 나라의 무덤을 골라, 무덤 구조가 다르기 때문에 남은 자료가 어떻게 달라졌는지 한 문장으로 쓰시오. :: (예) 고구려 돌방무덤은 도굴되어 벽화가 주로 남았고, 신라 돌무지덧널무덤은 도굴이 어려워 금관 같은 유물이 남았다.
