^ 가야가 하나의 국가로 **통합되지 못한 까닭**을 설명할 수 있다.
% 흐름: 생각 열기 5분 → 신라 10분 → 가야 8분 → 한강 쟁탈전 시뮬레이션 20분 → 정리 2분 (시뮬레이션이 길어 확인 문제는 다음 시간 시작에 써도 좋다)

? 5세기까지 고구려의 도움을 받던 신라가 6세기에 한강을 차지했다. 그사이 무엇이 바뀌었을까? :: 왕권이 강해지고 제도가 갖추어졌다.
% 문화유산채널 옛 주소가 열리지 않으면 국가유산채널에서 제목으로 찾기

## 신라 | 가장 늦게, 그러나

= 왕의 호칭이 바뀌다 | 신라
^+ 거서간 · 차차웅 · 이사금 — 박·석·김 세 성씨가 왕위를 번갈아
^+ ==마립간== (내물, 4세기 후반) — 김씨가 왕위를 이어감
^+ ==왕== (지증, 6세기 초) — 나라 이름도 '신라'로
? 이름이 바뀐 것은 무엇이 바뀐 것일까? :: 여러 세력의 대표에서, 혼자 나라를 다스리는 강한 왕으로 왕권이 커졌다.

= 신라를 키운 왕들
*+ 🏝️ 지증왕 :: 국호 '신라', '왕' 칭호, 이사부가 우산국 정벌(512)
*+ 📜 법흥왕 :: 율령 반포(520), 불교 공인(527), 금관가야 병합(532)
*+ 🗺️ 진흥왕 :: 화랑도 정비, 한강 유역 차지(553), 대가야 정복(562)
? 법흥왕 때 귀족들은 왜 불교를 반대했을까? :: 불교로 왕의 권위가 높아지면 귀족의 힘이 줄어들기 때문이다 — 이차돈의 순교

= 진흥왕 | 한강과 순수비
+ 551년 백제와 함께 한강 상류 → 553년 백제가 되찾은 하류까지 차지
+ 562년 ==대가야==를 정복하여 낙동강 유역 전체를 차지
+ 새 땅마다 **순수비** — 북한산 · 창녕 · 황초령 · 마운령
? 모두가 한강을 원한 이유 세 가지는? :: 넓은 농토, 많은 인구, 서해로 중국과 바로 통하는 바닷길

## 가야 | 철의 나라

= 가야 연맹 | 영상으로 보기
V 철갑옷의 비밀, 그 많은 철은 어디에서 왔을까? | 문화유산채널 5분 추리 X파일 | http://www.k-heritage.tv/brd/board/229/L/menu/245?thisPage=3&brdType=R&bbIdx=10641&grpBrdSearchCate=333&brdSearchCates=339&brdSearchDateYear=&orderByType=DESC&orderByColumn=&searchField=title&searchText=&viewType=1 | 덩이쇠·철갑옷 부분

= 가야 연맹
+ 변한 지역에서 여러 작은 나라가 성장 → 연맹 왕국
+ 전기: ==금관가야==(김해)가 이끔 — 덩이쇠를 낙랑·왜에 수출
+ 400년 고구려군의 공격으로 큰 타격 → 쇠퇴
+ 후기: ==대가야==(고령)가 이끔
+ 532년 금관가야, 562년 대가야가 신라에 병합

= 가야는 왜 하나가 되지 못했을까 | 생각하기
- 부유했지만 하나의 왕이 다스리는 나라가 되지 못했다.
+ 여러 나라가 비슷한 힘으로 각자 왕을 두었다
+ 고구려·백제·신라 사이에 끼어 계속 압박을 받았다
+ 중심 나라(금관가야)가 400년에 크게 약해졌다
>+ 가야 고분군은 2023년 ==유네스코 세계유산==으로 등재 — 7개 고분군
% 2023년 9월 등재: 김해 대성동, 함안 말이산, 합천 옥전, 고령 지산동, 고성 송학동, 창녕 교동과 송현동, 남원 유곡리와 두락리

## 시뮬레이션 | 한강 쟁탈전 371–562

= 한강 쟁탈전 | 모둠 20분
T 20 | 왕의 자리에서 결정하고, 실제 역사와 비교하기 — 11장면
@ sim.html | 모둠마다 30초 상의 → 투표 → '실제 역사 보기'
% '새 창으로 열기'로 크게 띄우고, 모둠 수를 먼저 정하기. 근거가 좋은 모둠에 + 점수

= 확인 문제 1
Q 법흥왕의 업적이 **아닌** 것은?
o 율령을 반포했다.
o 불교를 공인했다.
o 금관가야를 병합했다.
o* 대가야를 정복했다.
:: 대가야 정복(562)은 진흥왕.

= 확인 문제 2
Q 전기 가야 연맹을 이끌었던 나라와 그 중심지는?
o* 금관가야 — 김해
o 대가야 — 고령
o 금관가야 — 고령
o 대가야 — 김해
:: 전기는 김해의 금관가야, 후기는 고령의 대가야가 이끌었다.

= 생각 질문 | 서술형
? 진흥왕이 새 땅마다 순수비를 세운 것은 누구에게 보여 주려는 것이었을까? :: 그 땅의 백성에게는 새 왕을, 귀족에게는 왕의 업적을, 이웃 나라에게는 신라의 영토임을 알리려 했다.
? 가야는 삼국과 함께 500년 넘게 있었는데 왜 '삼국' 시대라 부를까? '사국 시대'라는 주장을 평가해 보자. :: 중앙 집권 국가로 성장하지 못했다는 기준 때문이다. 가야의 역할을 강조하려 '사국 시대'라 부르자는 주장도 있다.
? 순장 풍습은 가야 사회의 어떤 모습을 보여 줄까? :: 지배자의 권력이 매우 컸고 신분 차이가 컸다. 오늘날의 인권 기준과 당시 사람들의 믿음을 구분해 말하기.

= 오늘 배운 내용 정리
- 신라는 [[마립간]]을 거쳐 지증왕 때 '왕' 칭호를 썼다.
- [[법흥왕]]은 율령 반포와 불교 공인으로 왕권을 강화했다.
- [[진흥왕]]은 한강 유역을 차지하고 [[대가야]]를 정복했다.
- 가야는 [[철]]이 풍부했지만 연맹 왕국에 머물렀다.

= 나가기 전 한 문제 | 형성평가
? 553년 한강의 주인이 바뀐 사건을, 신라와 백제의 관계 변화와 함께 한 문장으로 쓰시오. :: 신라가 동맹국 백제가 되찾은 한강 하류를 차지하여 나·제 동맹이 깨졌다.
