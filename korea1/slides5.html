= 백제의 건국과 성장
+ 고구려에서 내려온 **온조**가 한강 유역 위례성에서 건국 (『삼국사기』, 기원전 18년)
+ **고이왕**(3세기) — 관등과 관복을 정해 나라의 틀을 세움
+ 서울 **풍납토성**·몽촌토성 — 한성 시기 왕성
+ 서울 석촌동 돌무지무덤 — ==고구려 무덤과 닮음== → 고구려에서 온 이주민이 세웠다는 증거

= 근초고왕 | 4세기 백제의 전성기
*+ ⚔️ 남쪽 :: 마한을 정복하여 전라도 남해안까지
*+ 🏹 북쪽 :: 371년 평양성 공격, 고구려 고국원왕 전사
*+ 🚢 바다 :: 동진(중국)·왜와 교류 — 칠지도
*+ 👑 왕위 :: 아버지에서 아들로 잇는 부자 상속
? 371년 고국원왕의 전사는 100년 뒤 475년과 어떻게 이어질까? :: 고구려는 백제를 원수로 여겼고, 장수왕의 남진으로 복수가 이루어졌다.

## 웅진 시대 | 위기에서 다시

= 한성 함락과 웅진 천도 | 475년
^+ 고구려 장수왕의 공격으로 한성 함락, **개로왕** 전사
^+ 문주왕이 수도를 ==웅진(공주)==으로 옮김
^+ 동성왕 — 신라와 결혼 동맹 (493)
? 웅진은 피난 수도로 왜 좋았고, 왜 오래 머물지 못했을까? :: 금강과 산으로 둘러싸여 지키기 좋았지만, 땅이 좁아 크게 발전하기 어려웠다.

= 무령왕 | 다시 강한 백제
+ 지방 22곳 ==22담로==에 왕족을 보내 다스림 → 지방 통제 강화
+ 중국 **남조 양**과 활발히 교류

## 사비 시대 | 새 출발과 좌절

= 성왕 | 사비 천도와 남부여
^+ 538년 수도를 ==사비(부여)==로 옮김 — 넓은 들, 금강 하구, 계획 도시
^+ 나라 이름을 ==남부여==로 — 부여를 잇는다는 뜻
^+ 551년 신라 진흥왕과 함께 한강 하류를 되찾음
^+ 553년 신라가 한강 하류마저 차지 → 나·제 동맹 깨짐
^+ 554년 관산성 전투에서 ==성왕 전사==
? 성왕이 신라와 손잡은 결정은 실수였을까? :: 한강을 되찾았다는 점에서는 성공, 동맹국을 믿었다가 빼앗긴 점에서는 실패 — 근거를 들어 판단하기

= 확인 문제 1
Q 근초고왕의 업적으로 옳은 것은?
o 22담로에 왕족을 보냈다.
o* 평양성을 공격하여 고국원왕을 전사시켰다.
o 사비로 수도를 옮겼다.
o 불교를 공인했다.
:: 22담로는 무령왕, 사비 천도는 성왕.

= 확인 문제 2
Q 백제가 웅진으로 수도를 옮긴 직접적인 까닭은?
o 신라에 한강을 빼앗겨서
o* 고구려에 한성을 빼앗겨서
o 넓은 들을 얻으려고
o 왜와 교류하려고
:: 475년 장수왕의 공격으로 한성이 함락되었다.

= 생각 질문 | 서술형
? 수도를 옮기는 것은 후퇴일까, 새 출발일까? 웅진 천도와 사비 천도를 나눠 따져 보자. :: 웅진 천도는 위기 속의 피난(후퇴), 사비 천도는 중흥을 위한 계획적 이동(새 출발)
? 성왕이 나라 이름을 '남부여'로 바꾼 까닭은? :: 백제 왕실이 부여에서 나왔다는 정통성을 내세워 나라를 다시 일으키려 했다.
? 도굴되지 않은 무령왕릉이 역사 연구에 왜 중요할까? :: 무덤 주인과 연대가 확실하고 유물이 그대로 남아 당시 문화와 교류를 정확히 알 수 있다.

= 오늘 배운 내용 정리
- 4세기 [[근초고왕]] 때 백제는 전성기를 맞았다.
- 475년 한성을 빼앗기고 [[웅진]]으로 수도를 옮겼다.
- 무령왕은 [[22담로]]에 왕족을 보내 지방을 다스렸다.
- 성왕은 538년 [[사비]]로 천도했으나 554년 [[관산성]]에서 전사했다.

= 나가기 전 한 문제 | 형성평가
? 백제의 국력이 가장 높았던 때와 가장 낮았던 때를 하나씩 고르고 까닭을 쓰시오. :: 가장 높음: 근초고왕(영토 확장·교류), 가장 낮음: 475년 한성 함락 또는 554년 성왕 전사
