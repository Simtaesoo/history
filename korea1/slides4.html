## 성장과 위기 | 산골 나라에서

= 고구려의 성장
+ 기원전 37년 주몽이 **졸본**에서 건국 (『삼국사기』)
+ 국내성으로 옮기고, 주변 나라를 정복하며 성장
+ 태조왕 — 옥저를 정복하고 왕위를 계루부 고씨가 이어감
+ 고국천왕 — 부족 이름이던 5부를 행정 구역으로 바꿈
>+ 4세기, 위기: 백제 근초고왕의 공격으로 ==고국원왕 전사== (371)

= 소수림왕 | 무너진 나라의 뼈대 세우기
*+ 🙏 불교 수용 (372) :: 백성의 마음을 하나로 — 왕은 곧 부처
*+ 🏫 태학 설립 (372) :: 나라를 다스릴 인재를 기르는 학교
*+ 📜 율령 반포 (373) :: 나라 전체에 같은 법과 제도
? 전쟁에서 크게 진 뒤, 소수림왕은 왜 싸움 대신 나라의 '뼈대'를 세웠을까? :: 귀족과 지방을 왕 중심으로 묶어야 다시 힘을 모을 수 있었기 때문이다.

## 광개토 대왕 | 비석이 말하는 정복

= 광개토 대왕 (391~412)
+ 중국식이 아닌 ==영락==이라는 연호를 썼다 — "우리 왕은 황제와 같다"
+ 북쪽: 후연·거란을 쳐서 **요동**을 차지
+ 남쪽: 백제를 공격하여 한강 북쪽까지 내려옴
+ 400년, 신라에 군대 5만을 보내 **왜를 물리침** → 금관가야도 큰 타격
? '영락'이라는 연호를 쓴 것은 무엇을 나타낼까? :: 중국과 대등한 나라라는 자신감(자주 의식)

= 능비를 읽다 | 사료
" 영락 6년(396), 왕이 몸소 군사를 이끌고 백잔(백제)을 토벌하였다. | 광개토 대왕릉비 (쉬운 말로 옮김)
"+ 영락 10년(400), 보병과 기병 5만을 보내 신라를 구원하게 하였다. 왜적이 물러나자 뒤쫓아 임나가라에 이르렀다. | 광개토 대왕릉비 (쉬운 말로 옮김)
? 백제를 '백잔'(남은 찌꺼기 같은 백제)이라 부른 것에서 무엇을 알 수 있을까? :: 능비는 고구려 입장에서 쓴 기록이다 — 적을 낮춰 부르고 승리를 강조했다.

## 장수왕 | 남쪽으로

= 장수왕 (413~491)
^+ 427년 수도를 국내성에서 ==평양==으로 옮김 → 남쪽으로 나아갈 준비
^+ 이에 맞서 신라와 백제가 손잡음 → ==나·제 동맹== (433)
^+ 475년 백제 수도 ==한성==을 함락, 개로왕 전사 → 한강 유역 차지
^+ 충주 고구려비 — 고구려가 남한강까지 내려왔다는 증거
? 장수왕은 왜 수도를 평양으로 옮겼을까? :: 넓은 평야와 바다가 있고, 남쪽(한반도)으로 진출하기 좋은 위치였다.

= 4~5세기 고구려 | 한눈에
| 왕 | 한 일 | 결과 |
|+ 소수림왕 | 불교·태학·율령 | 왕 중심 체제 |
|+ 광개토 대왕 | 요동·한강 이북 정복, 신라 구원 | 최대 영토의 바탕 |
|+ 장수왕 | 평양 천도, 한성 함락 | 한강 유역 차지 |

= 확인 문제 1
Q 소수림왕이 한 일이 **아닌** 것은?
o 불교를 받아들였다.
o 태학을 세웠다.
o 율령을 반포했다.
o* 수도를 평양으로 옮겼다.
:: 평양 천도(427)는 장수왕.

= 확인 문제 2
Q 광개토 대왕릉비를 세운 왕은?
o 소수림왕
o 광개토 대왕
o* 장수왕
o 근초고왕
:: 414년, 아들 장수왕이 아버지의 업적을 새겨 세웠다.

= 확인 문제 3
Q 475년에 일어난 일은?
o 고구려가 불교를 받아들였다.
o* 고구려가 백제의 한성을 함락했다.
o 신라가 한강을 차지했다.
o 고조선이 멸망했다.
:: 장수왕이 한성을 함락하고 백제는 웅진으로 수도를 옮겼다.

= 생각 질문 | 서술형
? 영토를 넓힌 왕과 제도를 만든 왕 중 누가 더 '위대한' 왕일까? 자신의 기준을 먼저 정하고 답해 보자. :: (예) 기준이 '오래가는 힘'이라면 소수림왕 — 제도가 있었기에 광개토 대왕의 정복이 가능했다.
? 광개토 대왕이 '영락'이라는 연호를 쓴 것은 무엇을 나타낼까? :: 중국과 대등하다는 자신감과 독자적인 천하관
? 능비처럼 승리한 쪽의 기록만 있다면 백제와 왜의 입장은 어떻게 되살릴 수 있을까? :: 『삼국사기』 백제본기, 일본 측 기록, 유물 등 다른 자료와 비교한다.

= 오늘 배운 내용 정리
- 소수림왕은 [[불교]] 수용, 태학 설립, [[율령]] 반포로 나라를 정비했다.
- 광개토 대왕은 [[영락]] 연호를 쓰고 영토를 크게 넓혔다.
- 400년 고구려는 신라를 도와 [[왜]]를 물리쳤다.
- 장수왕은 427년 [[평양]]으로 천도하고 475년 [[한성]]을 함락했다.

= 나가기 전 한 문제 | 형성평가
? 소수림왕의 정비가 광개토 대왕의 정복을 가능하게 했다는 주장을 한 문장으로 설명하시오. :: 불교·태학·율령으로 왕 중심의 나라 틀을 세워 힘을 모을 수 있었기 때문이다.
