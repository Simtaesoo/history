<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국가의 형성과 발전 · 역사② Ⅰ단원 수업 자료</title>
<meta name="description" content="2022 개정 교육과정 중학교 역사② Ⅰ단원 국가의 형성과 발전 — 차시별 영상, 교사 발문, 생각 질문, 수업 게임과 한강 쟁탈전 시뮬레이션">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="gnb"></div>
<main class="page" id="main"></main>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="map.js"></script>
<script>
(function () {
  const { esc, eraMini, gnb, I } = K1, U = UNIT;
  document.getElementById("gnb").innerHTML = gnb([["역사② Ⅰ단원", ""]]);
  const nVid = LESSONS.reduce((s, l) => s + l.videos.length, 0);
  const done = K1.store.get("done", {});
  const row = l => {
    const st = done[l.n] ? '<span class="chip ok">수업함</span>' : "";
    return `<li><a class="lrow" href="lesson.html?n=${l.n}">
      <span class="lnum">${l.n}<small>차시</small></span>
      <span class="ltitle"><b>${esc(l.title)}</b><span>${esc(l.eraLabel)} · ${l.std === "전체" ? "단원 정리" : esc(l.std)}</span></span>
      <span>${eraMini(l)}</span>
      <span class="lmeta">${st || `영상 ${l.videos.length} · ${esc(l.game.time)}`}</span>
      <span class="chev">${I.right.replace("<svg", '<svg width="18" height="18"')}</span></a></li>`;
  };
  const demo = { own: { gungnae: "G", pyeongyang: "G", hanseong: "S", chungju: "S", ungjin: "B", sabi: "B", gwansan: "S", geumseong: "S", daegaya: "Y", geumgwan: "S" }, cap: { G: "pyeongyang", B: "sabi", S: "geumseong" }, hl: ["hanseong"] };
  document.getElementById("main").innerHTML = `
    <section class="hero">
      <div>
        <div class="kicker"><span class="chip brand">2022 개정 교육과정</span><span class="chip">중학교 ${U.book}</span></div>
        <h1><small>${U.book} ${U.no}단원</small>${esc(U.title)}</h1>
        <p class="lead">고조선의 성립부터 562년 대가야 멸망까지. 차시마다 영상으로 열고, 발문으로 묻고, 게임으로 확인합니다. 교실 TV로 띄우는 <b>수업 모드</b>를 함께 씁니다.</p>
      </div>
      <div class="facts"><div><b class="num">${LESSONS.length}</b><span>차시</span></div><div><b class="num">${nVid}</b><span>추천 영상</span></div><div><b class="num">${LESSONS.length}</b><span>게임·시뮬레이션</span></div></div>
    </section>

    <section class="card" style="margin-bottom:20px">
      <div class="sec" style="padding-bottom:6px">
        <div class="sec-h"><h2>차시</h2><span class="meta">막대는 그 차시가 다루는 시기입니다</span></div>
      </div>
      <div style="display:grid;grid-template-columns:56px minmax(0,1fr) 210px 120px 28px;gap:16px;padding:0 26px 6px" class="screen-only lg-only" aria-hidden="true">
        <span></span><span></span><span style="position:relative;height:16px">${["기원전 2000", "1", "600년"].map((t, i) => `<span style="position:absolute;left:${[0, K1.eraX(1), 100][i]}%;transform:translateX(${["0", "-50%", "-100%"][i]});font-size:11px;color:var(--muted);white-space:nowrap">${t}</span>`).join("")}</span><span></span><span></span>
      </div>
      <ol class="lessons">${LESSONS.map(row).join("")}</ol>
    </section>

    <a class="card feature" href="sim.html" style="margin-bottom:20px">
      <div class="txt">
        <span class="chip brand">시뮬레이션 · 6차시</span>
        <h3>한강 쟁탈전 371–562</h3>
        <p>근초고왕, 소수림왕, 장수왕, 성왕, 진흥왕의 자리에 앉아 11번의 결정을 내립니다. 학생들이 고른 선택을 실제 역사와 비교하고, 지도에서 한강의 주인이 바뀌는 과정을 따라갑니다.</p>
        <span class="btn pri">${I.map}시뮬레이션 시작</span>
      </div>
      <div class="pic">${K1MAP.svg(demo, { small: true, label: "553년 신라가 한강 유역을 차지한 지도" })}</div>
    </a>

    <section class="card">
      <div class="sec">
        <div class="sec-h"><h2>성취기준</h2></div>
        <ul class="std">${U.standards.map(([c, t]) => `<li><code>${c}</code><span>${esc(t)}</span></li>`).join("")}</ul>
      </div>
      <div class="sec">
        <div class="sec-h"><h2>영상 표시 읽는 법</h2></div>
        <ul class="std">${Object.values(K1.BADGE).map(([t, c, d]) => `<li><span class="chip ${c}" style="justify-self:start">${t}</span><span>${d}</span></li>`).join("")}</ul>
      </div>
    </section>`;
  if (innerWidth < 880) document.querySelectorAll(".lg-only").forEach(e => e.hidden = true);
})();
</script>
</body>
</html>
