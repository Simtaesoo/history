= 서술형 연습 | 성취기준별
? [9역08-01] 8조법 세 조항을 근거로 고조선 사회의 모습 두 가지를 쓰시오. :: 생명을 중시했다(살인은 사형). 사유 재산과 노비 신분이 있었다(도둑은 노비로).
? [9역08-02] 4~6세기 한강의 주인이 바뀐 과정을 쓰고, 세 나라가 한강을 원한 까닭을 쓰시오. :: 백제(~475) → 고구려(475) → 백제·신라(551) → 신라(553). 넓은 농토·많은 인구·중국과 통하는 바닷길
? [9역08-03] 두 나라의 무덤을 비교하여 무덤 구조가 문화·교류에 대해 보여 주는 것을 쓰시오. :: (예) 무령왕릉은 남조 양식의 벽돌무덤 → 중국 남조와의 교류 / 신라 돌무지덧널무덤 → 도굴이 어려워 금관 등 화려한 문화가 남았다.

? 고조선·여러 나라·삼국·가야 중 오늘날 우리에게 가장 큰 영향을 남긴 나라는? 한 가지 근거로 주장해 보자. :: (예) 신라 — 한강과 낙동강을 차지하고 뒤에 삼국을 통일하여 이후 역사의 바탕이 되었다.

= 단원 정리 | 한 문장씩
- 청동기 시대에 [[지배자]]가 나타나고 첫 나라 [[고조선]]이 섰다.
- 고조선 뒤 [[부여]]·고구려·옥저·동예·삼한이 성장했다.
- 고구려 → 백제 → 신라는 [[율령]]과 [[불교]]로 나라를 정비하며 강해졌다.
- 삼국은 [[한강]]을 두고 다투었고, 신라가 553년 차지했다.
- 무덤과 유물은 삼국과 가야의 [[교류]]를 보여 준다.
