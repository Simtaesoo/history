## 고조선의 발전 | 왕이 다스리는 나라

= 고조선, 왕의 나라로 | 기원전 4세기 ~ 3세기
+ 기원전 4세기 무렵 왕을 칭하고, 중국의 **연**과 맞설 만큼 성장
+ 왕 아래 **상·대부·장군** 같은 관직을 두었다
+ 기원전 3세기에는 **부왕·준왕**처럼 왕위를 아들에게 물려주었다
>+ 왕위 세습 + 관직 = 나라의 틀이 갖추어졌다

= 위만의 집권 | 기원전 194년경
- 중국이 어지러울 때 **위만**이 무리 1천여 명을 이끌고 고조선으로 왔다.
+ 준왕은 위만에게 서쪽 국경을 지키게 했다.
+ 세력을 키운 위만이 준왕을 몰아내고 왕이 되었다 → ==위만 조선==
? 위만은 중국 쪽에서 왔는데 왜 나라 이름을 그대로 '조선'이라 했을까? :: 상투를 틀고 조선옷을 입고 왔다는 기록이 있어, 고조선 사람이거나 고조선을 이어받았다고 볼 수 있다.

= 위만 조선의 성장
*+ ⚒️ 철기 :: 철기 문화를 본격적으로 받아들여 농업과 무기가 발달
*+ 🗺️ 영토 :: 주변 지역을 정복하며 영토를 넓혔다
*+ 🚢 중계 무역 :: 남쪽의 진과 중국 한 사이에서 무역을 독점해 이익을 얻었다
? 중계 무역으로 부유해진 고조선을 한(漢)은 어떻게 보았을까? :: 무역 이익을 빼앗기고 고조선이 북방 세력과 손잡을까 경계했다.

## 8조법 | 법으로 보는 사회

= 8조법 | 지금은 세 조항만 전한다
" 사람을 죽인 자는 즉시 사형에 처한다. | 『한서』 지리지
"+ 남에게 상처를 입힌 자는 곡식으로 갚는다. | 『한서』 지리지
"+ 남의 물건을 훔친 자는 그 집의 노비로 삼는다. 용서받으려면 한 사람당 50만 전을 내야 한다. | 『한서』 지리지
% 한 조항씩 띄우고 "이 조항에서 알 수 있는 것은?"을 바로 묻기

= 조항에서 사회 읽기 | 추론하기
| 조항 | 알 수 있는 사회 모습 |
|+ 사람을 죽이면 사형 | 사람의 ==생명==과 노동력을 중시 |
|+ 상처를 입히면 곡식으로 | ==농경== 사회, 곡식이 재산 |
|+ 훔치면 노비로 | ==사유 재산== 인정, ==노비==(신분)가 있음 |
|+ 50만 전으로 용서 | ==화폐==를 사용 |
>+ 고조선은 재산과 신분의 차이가 있는 계급 사회였다.

## 고조선의 멸망 | 기원전 108년

= 한의 침략과 멸망 | 기원전 109 ~ 108년
^+ 한 무제가 대군을 보내 고조선을 공격 (기원전 109년)
^+ 고조선은 1년 가까이 맞서 싸웠다
^+ 지배층이 갈라지고 왕이 살해되며 왕검성이 함락 (기원전 108년)
^+ 한은 옛 땅에 군현을 두었으나, 고구려 등 주변의 반발 속에 점차 물러났다
? 고조선이 멸망한 까닭을 밖과 안으로 나눠 보자. :: 밖: 한의 대군 / 안: 오랜 전쟁 속 지배층의 분열

= 연표로 정리 | 고조선
| 때 | 일 |
|+ 기원전 2333년(기록) | 단군왕검, 고조선 건국 |
|+ 기원전 4세기 | 왕을 칭하고 연과 맞섬 |
|+ 기원전 194년경 | 위만이 왕이 됨 |
|+ 기원전 108년 | 왕검성 함락, 고조선 멸망 |

= 확인 문제 1
Q 8조법을 통해 알 수 있는 사실로 옳지 **않은** 것은?
o 사유 재산이 있었다.
o 노비가 있었다.
o 화폐를 사용했다.
o* 모든 사람이 평등했다.
:: 도둑질한 자를 노비로 삼는 것에서 신분 차이를 알 수 있다.

= 확인 문제 2
Q 위만 조선이 부유해진 까닭으로 가장 알맞은 것은?
o* 남쪽의 진과 중국 한 사이에서 중계 무역을 했다.
o 불교를 받아들였다.
o 한강 유역을 차지했다.
o 율령을 반포했다.
:: 철기 문화와 중계 무역으로 성장했다. 불교·율령·한강은 삼국 시대의 일.

= 생각 질문 | 서술형
? 전하는 8조법 세 조항만 보면 고조선을 평등한 사회라고 할 수 있을까? 근거 두 가지를 들어 보자. :: 할 수 없다. 노비가 있었고, 재산(곡식·화폐)의 차이가 있었다.
? 사라진 다섯 조항은 무엇이었을까? 남은 조항과 유물에서 근거를 찾아 하나를 추측해 보자. :: (예) 남의 땅의 경계를 침범한 자를 벌한다 — 농경 사회에서 토지가 중요했기 때문.
? 고조선은 한의 대군에 1년 가까이 맞섰는데도 왜 멸망했을까? :: 오랜 전쟁으로 지배층이 분열하고 항복하는 세력이 생겼기 때문이다.

= 오늘 배운 내용 정리
- 고조선은 기원전 4세기 무렵 [[왕]]을 칭하고 관직을 두었다.
- [[위만]]은 철기 문화와 [[중계 무역]]으로 고조선을 키웠다.
- 8조법으로 생명 존중, [[사유 재산]], 노비 신분, 화폐 사용을 알 수 있다.
- 고조선은 [[한]]의 침략으로 기원전 [[108]]년 멸망했다.
