= 누가 누구에게 준 칼일까? | 영상으로 보기
V 백제의 칼이자 일본의 국보, 칠지도의 진실 | KBS 역사저널 그날 | https://www.youtube.com/watch?v=VEYAXwetiCY | 해석이 갈리는 부분까지만

= 누가 누구에게 준 칼일까? | 생각 열기
? 칠지도는 백제가 왜에 '내려준' 칼일까, '바친' 칼일까? 한국과 일본의 해석은 왜 다를까? :: 글자의 해석과 각 나라의 시각이 다르기 때문이다. 판단하려면 글자·당시 관계·다른 기록을 함께 봐야 한다.
% 정답을 정하지 말고 '근거를 무엇으로 삼는지'에 집중. 칠지도는 일본 나라현 이소노카미 신궁에 있다

## 받아들인 문화 | 중국과 서역에서

= 중국에서 들어온 것
*+ 🙏 불교 :: 고구려(전진), 백제(동진)를 거쳐
*+ 📜 한자·유교 :: 고구려 태학, 율령
*+ 🧱 무덤 양식 :: 백제 무령왕릉의 벽돌무덤(남조 양)
>+ 받아들인 문화를 그대로 쓰지 않고 ==우리 식으로== 바꾸었다

= 멀리 서역에서 | 영상으로 보기
V 백제금동대향로, 세계에는 누가 살고 있을까? | 국립부여박물관 | https://modu.museum.go.kr/explore/video/20064 | 코끼리·원숭이·악어 장면만

= 멀리 서역에서 | 유물이 말한다
+ 신라 황남대총의 ==유리그릇== — 서아시아·지중해 쪽에서 온 것으로 본다
+ 고구려 각저총 씨름 그림 — 눈이 크고 코가 높은 **서역 사람**
+ 백제 금동 대향로의 코끼리·원숭이·악어 — 먼 남쪽 나라의 동물
? 신라 무덤의 유리그릇은 어떤 길로 왔을까? :: 초원길이나 바닷길로 여러 나라를 거쳐 들어왔다.

## 전한 문화 | 바다 건너 왜로

= 왜에 전한 문화
| 나라 | 전한 것 |
|+ 백제 | 아직기·왕인 — 한자·『논어』·『천자문』 / 노리사치계 — 불교 / 오경박사 |
|+ 고구려 | 담징 — 종이·먹 만드는 법 / 혜자 — 쇼토쿠 태자의 스승 |
|+ 신라 | 배 만드는 기술(조선술), 둑 쌓는 기술(축제술) |
|+ 가야 | 토기 만드는 기술 → 일본 ==스에키== |
>+ 이 문화는 일본 ==아스카 문화==의 바탕이 되었다
% 호류사 금당 벽화를 담징이 그렸다는 이야기는 전설이라 학계에서 논란이 있다는 점을 함께 알려 주기

= 사람이 건너갔다 | 영상으로 보기
V 백제 창왕, 아스카 문명의 시작을 열다 | KBS 역사스페셜(2008) | https://www.youtube.com/watch?v=Bbbs1_BaWRI | 긴 방송 — 아스카사 기술자 부분만 미리 골라 두기

= 사람이 건너갔다
? 물건이 아니라 '사람'이 건너간 것이 왜 중요할까? :: 사람은 기술과 생각을 함께 가져가, 받은 나라가 스스로 만들고 발전시킬 수 있게 된다.

T 15 | 유물·기술 카드를 '어디서 → 어디로' 항로에 싣기

= 확인 문제 1
Q 일본 스에키 토기에 영향을 준 나라는?
o 고구려
o 백제
o 신라
o* 가야
:: 가야의 단단한 회청색 토기 기술이 건너갔다.

= 확인 문제 2
Q 고구려 담징이 일본에 전한 것은?
o 『천자문』
o* 종이와 먹 만드는 법
o 불교
o 배 만드는 기술
:: 『천자문』은 백제 왕인, 불교는 백제 노리사치계, 조선술은 신라.

= 생각 질문 | 서술형
? 우리가 일본에 전한 문화만 강조하고 중국·서역에서 받은 문화는 가볍게 넘긴다면 어떤 오해가 생길까? :: 우리 문화가 처음부터 혼자 만들어졌다는 오해 — 실제로는 받아들이고 바꾸고 다시 전한 흐름이다.
? 같은 유물(칠지도)을 두고 두 나라 학자의 해석이 다르다면, 판단하려면 무엇을 더 확인해야 할까? :: 새긴 글자의 정확한 판독, 당시 백제·왜의 관계를 보여 주는 다른 기록과 유물
? 1,500년 전의 문화 교류와 오늘날 K-콘텐츠가 퍼지는 모습은 무엇이 비슷하고 무엇이 다를까? :: 비슷: 사람과 문화가 오가며 서로 영향을 준다. 다름: 지금은 인터넷으로 빠르게, 그때는 사람이 직접 건너가 오래 걸렸다.

= 오늘 배운 내용 정리
- 삼국은 중국에서 불교·한자·[[유교]]를 받아들였다.
- 신라 무덤의 [[유리그릇]]은 서역과의 교류를 보여 준다.
- 백제 [[왕인]]은 한자와 『천자문』을, 고구려 [[담징]]은 종이·먹 만드는 법을 전했다.
- 가야 토기는 일본 [[스에키]]에 영향을 주었다.

= 나가기 전 한 문제 | 형성평가
? 오늘 나온 유물·기술 하나를 골라 "○○에서 ○○로 간 ○○"의 형식으로 쓰고, 그 의미를 한 문장 덧붙이시오. :: (예) 가야에서 왜로 간 토기 기술 — 일본에서 단단한 스에키 토기를 만들게 되었다.
