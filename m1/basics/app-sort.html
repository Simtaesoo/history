<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 · 사료 감별사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#f3efe6;--dim:rgba(243,239,230,.62);--faint:rgba(243,239,230,.18);--bg:#121110;--panel:#1b1a18;--red:#c8432f;--gold:#d9b25f;--ok:#6fae7b;--serif:'Noto Serif KR','Nanum Myeongjo',serif;--sans:'IBM Plex Sans KR',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--faint)}
.top a{color:var(--dim);text-decoration:none;font-size:13px}
.rounds{display:flex;gap:6px;flex-wrap:wrap}
.rounds button{font:500 13px var(--sans);border:1px solid var(--faint);background:transparent;color:var(--dim);border-radius:999px;padding:4px 12px;cursor:pointer}
.rounds button[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
main{max-width:900px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 50px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,5vw,42px);margin:0}
.q{color:var(--gold);font-family:var(--serif);font-size:clamp(16px,2.2vw,21px);margin:0}
.hud{display:flex;gap:22px;color:var(--dim);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink);font-family:var(--serif);font-size:22px}
.card{width:min(620px,100%);min-height:150px;background:#f3efe6;color:#1d1b19;border-radius:16px;padding:22px 26px;font-family:var(--serif);font-size:clamp(18px,2.6vw,24px);font-weight:700;line-height:1.5;display:flex;align-items:center;justify-content:center;transition:transform .25s,opacity .25s}
.card.out-l{transform:translateX(-60px) rotate(-4deg);opacity:0}.card.out-r{transform:translateX(60px) rotate(4deg);opacity:0}
.card small{display:block;font:500 12.5px var(--sans);color:#6b645b;margin-top:8px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:min(620px,100%)}
.bin{font:700 18px var(--serif);border:2px solid var(--faint);background:var(--panel);color:var(--ink);border-radius:14px;padding:16px 10px;cursor:pointer}
.bin small{display:block;font:500 11.5px var(--sans);color:var(--dim);margin-top:4px}
.bin:hover,.bin:focus-visible{border-color:var(--gold);outline:none}
.flash{min-height:44px;font-size:14px;max-width:620px}
.flash.ok{color:var(--ok)}.flash.no{color:#e7836f}
.review{width:min(720px,100%);text-align:left;background:var(--panel);border-radius:14px;padding:16px 18px}
.review li{margin:6px 0;font-size:14px;color:var(--dim)}.review li b{color:var(--ink)}
button.go{font:500 15px var(--sans);background:var(--red);border:0;color:var(--ink);border-radius:999px;padding:9px 22px;cursor:pointer}
.how{color:var(--dim);font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="top"><a href="../index.html#u1">← 역사① 목록</a><div class="rounds" id="rounds"></div></div>
<main>
  <h1>사료 감별사</h1>
  <p class="q" id="q"></p>
  <div class="hud"><span>맞힌 수 <b id="score">0</b></span><span>연속 <b id="streak">0</b></span><span>남은 카드 <b id="left">0</b></span></div>
  <div class="card" id="card"></div>
  <div class="bins" id="bins"></div>
  <div class="flash" id="flash" aria-live="polite"></div>
  <p class="how">단추를 누르거나, 키보드 ← → (네 칸일 때 1~4)로 고릅니다.</p>
  <div class="review" id="review" hidden></div>
</main>
<script>
/* 판마다 칸(bins)과 카드 [문장, 답 번호, 해설]. 1단원 1~3차시에서 본 자료로 만들었습니다. */
const R={
 fact:{name:'사실일까 주장일까',q:'자료가 말하는 것 가운데, 확인할 수 있는 사실과 누군가의 판단·평가를 가려내자.',bins:[['사실','확인할 수 있는 일'],['주장','판단·평가·해석']],cards:[
  ['1404년 태종은 사냥을 하다 말에서 떨어졌다.',0,'『태종실록』에 날짜와 함께 적힌 일이다.'],
  ['태종은 체면을 지나치게 중요하게 여긴 왕이었다.',1,'기사 하나로 사람됨을 판단한 해석이다.'],
  ['1770년 보스턴에서 영국군의 발포로 5명이 죽었다.',0,'여러 기록이 함께 말하는 사건이다.'],
  ['보스턴의 일은 잔인한 학살이었다.',1,'‘학살’, ‘잔인한’은 평가가 담긴 말이다.'],
  ['광개토대왕릉비는 414년 장수왕이 세웠다.',0,'비문과 기록으로 확인되는 사실이다.'],
  ['광개토대왕은 우리 역사에서 가장 위대한 왕이다.',1,'‘가장 위대한’은 기준에 따라 달라지는 평가다.'],
  ['콜럼버스는 1492년 바하마의 한 섬에 닿았다.',0,'항해 기록 등으로 확인되는 사실이다.'],
  ['콜럼버스는 신대륙을 발견했다.',1,'이미 사람이 살던 땅을 ‘신대륙’, ‘발견’이라 부른 것은 유럽 쪽의 관점이다.'],
  ['베를린의 기념비에는 콘크리트 기둥 2,711개가 있다.',0,'세어서 확인할 수 있다.'],
  ['역사를 기억하는 가장 좋은 방법은 기념비를 세우는 것이다.',1,'방법에 대한 의견이다.']]},
 time:{name:'그때일까 나중일까',q:'그 일이 일어난 때 그 자리에서 만든 자료(1차 사료)인가, 뒤에 정리한 자료(2차 사료)인가?',bins:[['그때','1차 사료'],['나중','2차 사료']],cards:[
  ['보스턴 사건 3주 뒤 팔린 리비어의 판화 (1770년 보스턴 사건에 대해)',0,'사건 직후 그 도시에서 만든 자료다(편향은 따로 따져야 한다).'],
  ['1840년대에 그린 콜럼버스 상륙 그림 (1492년 일에 대해)',1,'약 350년 뒤에 그린 것이다.'],
  ['사관이 왕 곁에서 그날그날 적은 사초',0,'그 자리에서 쓴 기록이다.'],
  ['오늘날 출판된 중학교 역사 교과서',1,'여러 자료를 모아 정리한 2차 자료다.'],
  ['생아슐 유적에서 나온 주먹도끼 (구석기 사람들의 삶에 대해)',0,'그때 사람이 직접 만든 물건이다.'],
  ['3·1 운동 100주년에 만든 다큐멘터리',1,'뒤에 만든 해석이다.'],
  ['1919년 3월 1일 배포된 독립선언서',0,'그날 만들어 나눈 자료다.'],
  ['박물관 안내판의 유물 설명',1,'학예사가 뒤에 정리한 글이다.']]},
 kind:{name:'무엇으로 남았나',q:'사료의 종류를 가려 보자.',bins:[['글','문헌'],['물건','유물·유적'],['그림','그림·사진'],['말','구술·노래']],cards:[
  ['『조선왕조실록』',0,'글로 남은 문헌 사료.'],['주먹도끼',1,'돌을 깎아 만든 유물.'],['보스턴 학살 판화',2,'그림 사료.'],
  ['할머니가 들려준 피란 이야기',3,'겪은 사람의 말(구술).'],['광개토대왕릉비',1,'유적이자 글이 새겨진 돌. 물건으로도, 글로도 읽을 수 있다.'],
  ['1900년 무렵 조선의 가게 사진',2,'사진 사료.'],['마을에 전해 오는 노래',3,'입에서 입으로 전한 사료.'],['『동국통감』',0,'역사책(문헌).']]}
};
const $=id=>document.getElementById(id);let key='fact',deck=[],score=0,streak=0,wrong=[],busy=false;
$('rounds').innerHTML=Object.entries(R).map(([k,r])=>`<button type="button" data-k="${k}">${r.name}</button>`).join('');
$('rounds').onclick=e=>{const b=e.target.closest('button');if(b){key=b.dataset.k;start();}};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  const r=R[key];deck=shuffle(r.cards.slice());score=0;streak=0;wrong=[];busy=false;
  [...$('rounds').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===key));
  $('q').textContent=r.q;$('bins').innerHTML=r.bins.map((b,i)=>`<button class="bin" type="button" data-i="${i}">${b[0]}<small>${b[1]}</small></button>`).join('');
  $('review').hidden=true;$('flash').textContent='';$('flash').className='flash';show();
}
function show(){
  $('score').textContent=score;$('streak').textContent=streak;$('left').textContent=deck.length;
  const c=$('card');c.className='card';
  if(!deck.length){c.innerHTML=`${score} / ${R[key].cards.length}<small>${wrong.length?'아래에서 틀린 카드를 다시 보세요.':'모두 맞혔습니다!'}</small>`;
    $('bins').querySelectorAll('button').forEach(b=>b.disabled=true);
    $('review').hidden=false;$('review').innerHTML=(wrong.length?'<ul>'+wrong.map(w=>`<li><b>${w[0]}</b> → ${R[key].bins[w[1]][0]} · ${w[2]}</li>`).join('')+'</ul>':'')+'<button class="go" type="button" onclick="start()">다시 하기</button>';return;}
  c.textContent=deck[0][0];
}
function pick(i){
  if(busy||!deck.length)return;busy=true;const c=deck[0],ok=c[1]===i;
  if(ok){score++;streak++;}else{streak=0;wrong.push(c);}
  $('flash').className='flash '+(ok?'ok':'no');$('flash').textContent=(ok?'맞아요. ':'아니에요 — '+R[key].bins[c[1]][0]+'. ')+c[2];
  $('card').classList.add(i===0?'out-l':'out-r');
  setTimeout(()=>{deck.shift();busy=false;show();},ok?500:1100);
}
$('bins').onclick=e=>{const b=e.target.closest('.bin');if(b)pick(+b.dataset.i);};
addEventListener('keydown',e=>{const n=R[key].bins.length;
  if(n===2&&e.key==='ArrowLeft')pick(0);else if(n===2&&e.key==='ArrowRight')pick(1);
  else if(/^[1-4]$/.test(e.key)&&+e.key<=n)pick(+e.key-1);});
start();
</script>
</body>
</html>
