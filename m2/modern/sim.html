<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시뮬레이션 · 역사② 6단원 근현대 사회로의 변화</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../assets/sim.css">
</head>
<body>
<div class="top"><a href="../index.html#u6">← 역사② 목록</a><nav id="nav"></nav></div>

<section class="panel" data-lesson="4">
  <h1>만세는 어떻게 퍼졌을까</h1>
  <p class="q">서울에서 시작된 만세가 어떻게 시골 장터까지 갔을까?</p>
  <div class="stage">
    <div><canvas id="cv" width="760" height="560" aria-label="마을과 장터 모형. 점이 붉게 바뀌면 만세 시위가 일어난 마을"></canvas>
      <div class="log" id="log"></div></div>
    <div class="side">
      <div class="day" id="day">3월 1일<small>만세에 참여한 마을 0 / 0</small></div>
      <div class="sw">
        <label><input type="checkbox" id="oRel" checked><div><b>종교 조직</b><span>천도교·기독교·불교 조직이 선언서를 여러 도시에 미리 나눠 줌</span></div></label>
        <label><input type="checkbox" id="oStu" checked><div><b>학생의 귀향</b><span>학교가 문을 닫자 학생들이 고향으로 돌아감</span></div></label>
        <label><input type="checkbox" id="oMkt" checked><div><b>장날</b><span>닷새마다 열리는 장터에 이웃 마을 사람이 모임</span></div></label>
      </div>
      <div class="rng"><label for="oSup">탄압 강도 <b id="supV">보통</b></label><input type="range" id="oSup" min="0" max="2" step="1" value="1"></div>
      <div class="btns"><button class="go" id="bRun" type="button">시작</button><button id="bStep" type="button">하루씩</button><button id="bReset" type="button">처음으로</button></div>
      <p class="note">실제 지도나 기록이 아니라, 퍼지는 방식을 생각해 보기 위한 <b>모형</b>입니다. 스위치를 하나씩 끄고 다시 돌려 보세요. 어느 것을 껐을 때 가장 크게 달라지나요?</p>
    </div>
  </div>
</section>

<p class="soon" id="soon" hidden>이 차시 시뮬레이션은 준비 중입니다.</p>

<script src="../../assets/sim.js"></script>
<script>
/* 4차시: 마을·장터 확산 모형 */
(function(){
  const cv=document.getElementById('cv'),cx=cv.getContext('2d'),W=cv.width,H=cv.height;
  const $=id=>document.getElementById(id);
  let rnd,V,M,day,timer,hist;
  function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
  function build(){
    rnd=seeded(1919);V=[];M=[];
    // 도시 6곳, 장터 14곳, 마을 150곳 (고정 배치로 매번 같은 판)
    const cities=[[.22,.2],[.5,.12],[.78,.25],[.3,.55],[.65,.6],[.45,.85]];
    cities.forEach(([x,y],i)=>V.push({x:x*W,y:y*H,city:true,st:0,mk:-1,at:-1}));
    for(let i=0;i<14;i++)M.push({x:(.08+rnd()*.84)*W,y:(.08+rnd()*.84)*H,d:i%5});
    for(let i=0;i<150;i++){const x=(.04+rnd()*.92)*W,y=(.04+rnd()*.92)*H;
      let best=0,bd=1e9;M.forEach((m,j)=>{const d=Math.hypot(m.x-x,m.y-y);if(d<bd){bd=d;best=j;}});
      V.push({x,y,city:false,st:0,mk:best,at:-1,home:rnd()<.12});}
    day=0;hist=[];
  }
  const sup=()=>[.02,.06,.14][+$('oSup').value];
  function ignite(v){if(v.st===0){v.st=1;v.at=day;}}
  function step(){
    if(day>=60){stop();return;}
    day++;const rel=$('oRel').checked,stu=$('oStu').checked,mkt=$('oMkt').checked,s=sup();
    if(day===1){V.filter(v=>v.city).forEach((v,i)=>{if(i===1||rel)ignite(v);});}
    // 종교 조직: 도시 둘레 마을로 조금씩
    if(rel&&day>1)V.forEach(v=>{if(v.st===0&&!v.city){const near=V.some(c=>c.city&&c.st===1&&Math.hypot(c.x-v.x,c.y-v.y)<110);if(near&&rnd()<.05)ignite(v);}});
    // 학생 귀향: 열흘쯤 지나 고향 마을에 소식
    if(stu&&day>=8&&day<=20)V.forEach(v=>{if(v.home&&v.st===0&&rnd()<.12)ignite(v);});
    // 장날: 장터에 모인 마을끼리 번짐
    if(mkt)M.forEach((m,j)=>{if(day%5!==m.d)return;const g=V.filter(v=>v.mk===j);
      if(g.some(v=>v.st===1))g.forEach(v=>{if(v.st===0&&rnd()<.45)ignite(v);});});
    // 이웃 마을끼리 아주 느리게
    V.forEach(v=>{if(v.st===0&&!v.city&&rnd()<.004&&V.some(u=>u.st===1&&Math.hypot(u.x-v.x,u.y-v.y)<45))ignite(v);});
    // 탄압: 시위가 일어난 마을이 더 퍼뜨리지 못하게 됨
    V.forEach(v=>{if(v.st===1&&v.at<day&&rnd()<s)v.st=2;});
    hist.push(V.filter(v=>v.at>=0).length);draw();
  }
  function date(d){const t=new Date(1919,2,d);return(t.getMonth()+1)+'월 '+t.getDate()+'일';}
  function draw(){
    cx.clearRect(0,0,W,H);
    cx.strokeStyle='rgba(217,178,95,.18)';cx.lineWidth=1;
    V.forEach(v=>{if(v.mk>=0){const m=M[v.mk];cx.beginPath();cx.moveTo(v.x,v.y);cx.lineTo(m.x,m.y);cx.stroke();}});
    M.forEach(m=>{const today=day>0&&day%5===m.d;cx.fillStyle=today?'#d9b25f':'rgba(217,178,95,.45)';cx.fillRect(m.x-6,m.y-6,12,12);});
    V.forEach(v=>{cx.beginPath();cx.arc(v.x,v.y,v.city?10:4.5,0,7);
      cx.fillStyle=v.st===1?'#c8432f':v.st===2?'#7a3a2e':'rgba(243,239,230,.35)';cx.fill();
      if(v.city){cx.strokeStyle='#f3efe6';cx.lineWidth=1.5;cx.stroke();}});
    // 그래프
    const gx=16,gy=H-16,gw=W-32,gh=70,n=V.length;
    cx.fillStyle='rgba(18,17,16,.7)';cx.fillRect(gx-6,gy-gh-8,gw+12,gh+16);
    cx.strokeStyle='#c8432f';cx.lineWidth=2;cx.beginPath();
    hist.forEach((c,i)=>{const x=gx+i/60*gw,y=gy-c/n*gh;i?cx.lineTo(x,y):cx.moveTo(x,y);});cx.stroke();
    cx.fillStyle='rgba(243,239,230,.6)';cx.font='12px IBM Plex Sans KR, sans-serif';
    cx.fillText('3월 1일',gx,gy+12-2);cx.fillText('4월 29일',gx+gw-48,gy+12-2);cx.fillText('참여한 마을 수',gx,gy-gh+6);
    const joined=V.filter(v=>v.at>=0).length;
    $('day').innerHTML=(day?date(day):'3월 1일')+`<small>만세에 참여한 마을 ${joined} / ${V.length}</small>`;
  }
  function stop(){clearInterval(timer);timer=null;$('bRun').textContent='시작';}
  function reset(){stop();build();draw();}
  $('bRun').onclick=()=>{if(timer){stop();return;}if(day>=60){reset();}timer=setInterval(step,180);$('bRun').textContent='멈춤';};
  $('bStep').onclick=()=>{stop();step();};
  $('bReset').onclick=()=>{const j=V?V.filter(v=>v.at>=0).length:0;if(day>0){const on=['oRel','oStu','oMkt'].filter(i=>$(i).checked).map(i=>({oRel:'종교',oStu:'학생',oMkt:'장날'})[i]).join('·')||'모두 끔';
    $('log').insertAdjacentHTML('afterbegin',`<div>${on} / 탄압 ${$('supV').textContent}<br><b>${j}</b>곳 · ${date(day)}</div>`);}reset();};
  $('oSup').oninput=()=>{$('supV').textContent=['약함','보통','강함'][+$('oSup').value];};
  reset();
})();
</script>
</body>
</html>
