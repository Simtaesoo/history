<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 · 근현대 연표 퍼즐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#f3efe6;--dim:rgba(243,239,230,.62);--faint:rgba(243,239,230,.18);--bg:#121110;--panel:#1b1a18;--red:#c8432f;--gold:#d9b25f;--ok:#6fae7b;--serif:'Noto Serif KR','Nanum Myeongjo',serif;--sans:'IBM Plex Sans KR',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--faint)}
.top a{color:var(--dim);text-decoration:none;font-size:13px}
.top select{font:500 13px var(--sans);background:var(--panel);color:var(--ink);border:1px solid var(--faint);border-radius:999px;padding:4px 10px}
main{max-width:1000px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 50px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,5vw,42px);margin:0;line-height:1.2}
.q{color:var(--gold);font-family:var(--serif);font-size:clamp(16px,2.2vw,21px);margin:4px 0 0}
.how{color:var(--dim);font-size:13.5px;margin:0}
.line{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s}
.slot{min-height:92px;border:1.5px dashed var(--faint);border-radius:12px;padding:10px 12px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:4px}
.slot::before{counter-increment:s;content:counter(s);position:absolute;top:6px;right:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.slot.next{border-color:var(--gold)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.card{font:500 15px/1.4 var(--sans);text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--faint);border-radius:12px;padding:12px 14px;cursor:pointer;max-width:260px}
.card:hover,.card:focus-visible{border-color:var(--gold);outline:none}
.slot .card{max-width:none;width:100%;background:transparent;border:0;padding:0}
.slot.ok{border:2px solid var(--ok)}.slot.no{border:2px solid var(--red)}
.slot.ok::before{content:'✓ ' counter(s);color:var(--ok)}.slot.no::before{content:'✗ ' counter(s);color:var(--red)}
.answer{margin:8px 0 0;font-size:13.5px;color:var(--dim)}
.date{font-family:var(--serif);font-weight:900;color:var(--gold);font-size:15px}
.why{font-size:12.5px;color:var(--dim)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{font:500 14px var(--sans);border-radius:999px;padding:8px 18px;cursor:pointer;border:1px solid var(--faint);background:transparent;color:var(--ink)}
button.go{background:var(--red);border-color:var(--red)}
button.b:disabled{opacity:.4;cursor:default}
.score{font-family:var(--serif);font-weight:900;font-size:22px}
.after{background:var(--panel);border-radius:12px;padding:14px 16px;border-left:3px solid var(--gold)}
.after p{margin:0}
.src{font-size:11.5px;color:var(--dim)}
</style>
</head>
<body>
<div class="top"><a href="../index.html#u6">← 역사② 목록</a>
  <label>판 고르기 <select id="round"></select></label></div>
<main>
  <header><h1 id="title"></h1><p class="q" id="q"></p></header>
  <p class="how">카드를 누르면 빈칸에 차례로 들어갑니다. 들어간 카드를 누르면 다시 빠집니다. 다 채우면 [맞춰 보기].</p>
  <div class="line" id="line"></div>
  <div class="pool" id="pool"></div>
  <div class="btns"><button class="b go" id="bCheck" type="button" disabled>맞춰 보기</button><button class="b" id="bNew" type="button">새 판</button>
    <label><input type="checkbox" id="hard"> 어려움(카드 8장)</label><span class="score" id="score"></span></div>
  <div class="after" id="after" hidden><p id="afterQ"></p><p class="answer" id="answer"></p></div>
  <p class="src">날짜: 국사편찬위원회·독립기념관 등 일반 연표 기준. 고종의 장례(인산)는 1919년 3월 3일.</p>
</main>
<script>
/* 판마다 [사건, 날짜 표기, 비교용 값, 한 줄 의미]. 단원의 차시가 늘면 판을 더합니다. */
const ROUNDS={
  samil:{title:'1919, 만세의 해',lesson:'4차시 3·1 운동',q:'무엇이 먼저였을까? 순서가 바뀌면 이야기가 어떻게 달라질까?',
    after:'민족 자결 원칙과 파리 강화 회의가 3·1 운동보다 먼저였다는 것은 무엇을 뜻할까? 운동을 이끈 사람들은 누구의 눈을 의식했을까?',
    cards:[
     ['윌슨, 14개조 평화 원칙 발표','1918. 1. 8.',19180108,'민족 자결 원칙이 알려짐'],
     ['파리 강화 회의 개막','1919. 1. 18.',19190118,'전쟁 뒤 세계 질서를 정하는 회의'],
     ['고종 세상을 떠남','1919. 1. 21.',19190121,'독살설이 퍼지며 민심이 들끓음'],
     ['도쿄 유학생 2·8 독립 선언','1919. 2. 8.',19190208,'일본 한복판에서 먼저 선언'],
     ['보성사에서 독립선언서 인쇄','1919. 2. 27.',19190227,'천도교 인쇄소, 약 2만 1천 장'],
     ['서울에서 독립 선언과 만세 시위','1919. 3. 1.',19190301,'태화관과 탑골 공원'],
     ['고종의 장례(인산)','1919. 3. 3.',19190303,'장례에 모인 인파'],
     ['천안 아우내 장터 만세 시위','1919. 4. 1.',19190401,'장날에 모인 사람들'],
     ['대한민국 임시 정부 수립','1919. 4. 11.',19190411,'상하이, 민주 공화제'],
     ['제암리에서 주민 학살','1919. 4. 15.',19190415,'비폭력 시위에 대한 보복'],
     ['중국 5·4 운동','1919. 5. 4.',19190504,'베이징 학생들의 시위']]}
};
const $=id=>document.getElementById(id);
let R,deck,placed,checked;
$('round').innerHTML=Object.entries(ROUNDS).map(([k,r])=>`<option value="${k}">${r.lesson}</option>`).join('');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function deal(){
  R=ROUNDS[$('round').value];$('title').textContent=R.title;$('q').textContent=R.q;
  deck=shuffle(R.cards.slice()).slice(0,$('hard').checked?8:5);placed=[];checked=false;
  $('score').textContent='';$('after').hidden=true;render();
}
function card(c,where){return `<button class="card" type="button" data-k="${c[2]}" data-w="${where}">${c[0]}${checked?`<div class="date">${c[1]}</div><div class="why">${c[3]}</div>`:''}</button>`;}
function render(){
  const n=deck.length,right=deck.slice().sort((a,b)=>a[2]-b[2]);
  $('line').innerHTML=Array.from({length:n},(_,i)=>{const c=placed[i];
    const cls=checked?(c===right[i]?' ok':' no'):(i===placed.length?' next':'');
    return `<div class="slot${cls}">${c?card(c,'slot'):''}</div>`;}).join('');
  $('pool').innerHTML=deck.filter(c=>!placed.includes(c)).map(c=>card(c,'pool')).join('');
  $('bCheck').disabled=checked||placed.length<n;
}
document.addEventListener('click',e=>{const b=e.target.closest('.card');if(!b||checked)return;
  const c=deck.find(x=>x[2]===+b.dataset.k);
  if(b.dataset.w==='pool')placed.push(c);else placed=placed.filter(x=>x!==c);render();});
$('bCheck').onclick=()=>{checked=true;const right=deck.slice().sort((a,b)=>a[2]-b[2]);
  const ok=placed.filter((c,i)=>c===right[i]).length;render();
  $('score').textContent=`${ok} / ${deck.length} 자리 맞음`;$('afterQ').textContent=R.after;$('answer').textContent='바른 순서: '+right.map(c=>c[0]).join(' → ');$('after').hidden=false;};
$('bNew').onclick=deal;$('round').onchange=deal;$('hard').onchange=deal;
deal();
</script>
</body>
</html>
